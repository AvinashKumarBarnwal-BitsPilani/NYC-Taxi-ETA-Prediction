# NYC Taxi ETA Prediction
# Phase 3 - Step 2.11
# Data Validation Contract: Defines what constitutes a valid TRAIN/TEST record and serves as the single source of truth for Phase 3 validation.

version: "1.0"

datasets:

  train:
    required_columns:
      - id
      - vendor_id
      - pickup_datetime
      - dropoff_datetime
      - passenger_count
      - pickup_longitude
      - pickup_latitude
      - dropoff_longitude
      - dropoff_latitude
      - store_and_fwd_flag
      - trip_duration

    data_types:
      id: string
      vendor_id: integer
      pickup_datetime: datetime
      dropoff_datetime: datetime
      passenger_count: integer
      pickup_longitude: float
      pickup_latitude: float
      dropoff_longitude: float
      dropoff_latitude: float
      store_and_fwd_flag: categorical
      trip_duration: numeric

  test:
    required_columns:
      - id
      - vendor_id
      - pickup_datetime
      - passenger_count
      - pickup_longitude
      - pickup_latitude
      - dropoff_longitude
      - dropoff_latitude
      - store_and_fwd_flag

    data_types:
      id: string
      vendor_id: integer
      pickup_datetime: datetime
      passenger_count: integer
      pickup_longitude: float
      pickup_latitude: float
      dropoff_longitude: float
      dropoff_latitude: float
      store_and_fwd_flag: categorical


# Categorical validation rules
categorical_rules:

  vendor_id:
    allowed_values:
      - 1
      - 2

  store_and_fwd_flag:
    allowed_values:
      - "N"
      - "Y"


# Numeric validation rules
numeric_rules:

  passenger_count:
    min_exclusive: 0

  pickup_latitude:
    min: -90
    max: 90

  pickup_longitude:
    min: -180
    max: 180

  dropoff_latitude:
    min: -90
    max: 90

  dropoff_longitude:
    min: -180
    max: 180

  trip_duration:
    min_exclusive: 0


# Datetime validation rules
datetime_rules:

  pickup_datetime:
    required: true

  dropoff_datetime:
    required: true

  chronological_order:
    rule: "pickup_datetime < dropoff_datetime"


# Target validation rules
target_rules:

  target_column: trip_duration

  rules:
    - "trip_duration > 0"
    - "trip_duration == (dropoff_datetime - pickup_datetime) in seconds"


# Missing-value rules
missing_value_rules:

  required_columns_must_not_be_null: true

  handling:
    action: flag
    silent_deletion: false


# Duplicate rules
duplicate_rules:

  id:
    must_be_unique: true

  complete_rows:
    duplicates_allowed: false

  handling:
    action: flag
    silent_deletion: false


# Important:
# No NYC-specific geographic boundary has been defined yet.
# No maximum trip_duration has been defined yet.
# Extreme values require investigation before a cleaning decision.