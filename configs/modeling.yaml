# ==========================================================
# NYC Taxi ETA Prediction
# Phase 4 - Model Building Configuration
# ==========================================================

problem:
  type: regression
  target: trip_duration

features:
  - numerical__distance_km
  - categorical__vendor_id_1.0
  - categorical__vendor_id_2.0
  - categorical__store_and_fwd_flag_N
  - categorical__store_and_fwd_flag_Y

metrics:
  primary: rmse
  secondary: mae
  context: r2

data:
  train_features: data/processed/X_train_processed.csv
  validation_features: data/processed/X_val_processed.csv
  train_target: data/split/y_train.csv
  validation_target: data/split/y_val.csv

artifacts:
  model_directory: models
  report_directory: reports

candidates:
  linear_regression:
    enabled: true

  random_forest:
    enabled: true
    params:
      n_estimators: 50
      max_depth: 15
      min_samples_leaf: 2
      random_state: 42
      n_jobs: -1

  xgboost:
    enabled: true
    params:
      n_estimators: 200
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 1.0
      random_state: 42
      n_jobs: -1
      objective: reg:squarederror
      tree_method: hist  