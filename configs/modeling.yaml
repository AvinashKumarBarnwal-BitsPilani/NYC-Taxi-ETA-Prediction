# ==========================================================
# NYC Taxi ETA Prediction
# Phase 4 - Model Building Configuration
# ==========================================================

problem:
  type: regression
  target: trip_duration

features:
  - numerical__distance_km
  - passthrough_numerical__passenger_count
  - passthrough_numerical__pickup_hour
  - passthrough_numerical__pickup_day_of_week
  - passthrough_numerical__pickup_month
  - passthrough_numerical__is_weekend
  - categorical__vendor_id_1
  - categorical__vendor_id_2
  - categorical__store_and_fwd_flag_N
  - categorical__store_and_fwd_flag_Y

metrics:
  primary: rmse
  secondary: mae
  context: r2

data:
  train_features: data/processed/X_train_processed.csv
  validation_features: data/processed/X_val_processed.csv
  train_target: data/split/y_train.csv
  validation_target: data/split/y_val.csv

artifacts:
  model_directory: models
  report_directory: reports

candidates:
  linear_regression:
    enabled: true

  random_forest:
    enabled: true
    params:
      n_estimators: 50
      max_depth: 15
      min_samples_leaf: 2
      random_state: 42
      n_jobs: -1

  xgboost:
    enabled: true
    params:
      n_estimators: 200
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 1.0
      random_state: 42
      n_jobs: -1
      objective: reg:squarederror
      tree_method: hist  

 # This is for Hyperparameter Tuning     
tuning:
  framework: optuna
  sampler: tpe
  n_trials: 20
  metric: rmse
  direction: minimize
  model: xgboost

  xgboost:
    search_space:
      n_estimators:
        min: 100
        max: 500
      max_depth:
        min: 3
        max: 10
      learning_rate:
        min: 0.01
        max: 0.2
      subsample:
        min: 0.6
        max: 1.0
      colsample_bytree:
        min: 0.6
        max: 1.0
      min_child_weight:
        min: 1
        max: 10
      reg_alpha:
        min: 0.0
        max: 1.0
      reg_lambda:
        min: 0.1
        max: 10.0